[profile.default]
src = "src"
test = "test"
libs = ["lib"]
solc_version = "0.8.29"
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/", "forge-std/=lib/forge-std/src/"]

[invariant]
runs = 1000
depth = 100
fail_on_revert = false
call_override = false

